name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    name: MyBB installer CLI (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, sodium, zip
          coverage: none
      - name: Validate and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Lint installer PHP
        run: |
          php -l bin/mybb-install
          find src -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
